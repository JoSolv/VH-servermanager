name: Publish container image

# Builds the image and pushes it to GitHub's own registry (ghcr.io).
#
# Every branch is built, because naming specific branches here means nothing
# happens on a repository whose branch is called something else -- and then
# every update needs a manual "Run workflow". The `:latest` tag still only
# follows the repository's default branch, so other branches get their own
# tag and cannot quietly replace what your server pulls.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Valheim server is an x86_64 binary, so there is no arm64 image to
      # build; no QEMU/cross-build setup is needed.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; repository names need not be.
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Lets the running container report which commit it is, which is the
          # only reliable answer to "did my update actually land" when the tag
          # being pulled is mutable.
          build-args: |
            VHSM_BUILD_SHA=${{ github.sha }}
            VHSM_BUILD_TIME=${{ steps.name.outputs.built_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "A new package is **private** until you change it:"
            echo "repository → Packages → this package → Package settings →"
            echo "Change visibility → Public. TrueNAS cannot pull it otherwise."
          } >> "$GITHUB_STEP_SUMMARY"
