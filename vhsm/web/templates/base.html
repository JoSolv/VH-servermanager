<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Valheim Server Manager{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9968;</text></svg>">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="rune">&#9968;</span> Valheim Server Manager</a>
  <nav>
    <a href="/" class="{{ 'active' if nav == 'dashboard' }}">Dashboard</a>
    <a href="/settings" class="{{ 'active' if nav == 'settings' }}">Settings</a>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span title="{{ vhsm_build.source }}{% if vhsm_build.built_at %}, built {{ vhsm_build.built_at }}{% endif %}">
    vhsm {{ vhsm_build.version }}{% if vhsm_build.short_commit %} &middot; {{ vhsm_build.short_commit }}{% endif %}
  </span>
</footer>
</body>
</html>
