<div id="build-status" hx-target="this" hx-swap="outerHTML">
  <table>
    <tr><th>Installed build</th><td><code>{{ build.installed or 'unknown' }}</code></td></tr>
    <tr><th>Latest build</th><td><code>{{ build.latest or 'unknown' }}</code></td></tr>
    <tr>
      <th>Version status</th>
      <td>
        {% if build.available %}
          <span class="tag upd">update available</span>
        {% elif build.installed and build.latest %}
          <span class="tag ok-tag">up to date</span>
        {% else %}
          <span class="muted">not checked yet</span>
        {% endif %}
      </td>
    </tr>
  </table>
  <button class="small" hx-post="/settings/check-update">Check for updates</button>
  <span class="spinner">checking…</span>
</div>
